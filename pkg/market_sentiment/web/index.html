<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A股市场情绪指数</title>
  <style>
    :root { --ink:#172033; --muted:#667085; --line:#e4e7ec; --paper:#fff; --bg:#f4f5f7; --red:#d94a4a; --blue:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    main { max-width:1320px; margin:auto; padding:34px 24px 64px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:24px; }
    h1 { margin:0; font-size:30px; letter-spacing:-.5px; } h2 { margin:0 0 16px; font-size:17px; }
    .subtitle,.muted { color:var(--muted); } .subtitle { margin-top:4px; }
    button { border:0; border-radius:8px; background:var(--ink); color:white; padding:11px 18px; font-weight:650; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .notice { display:none; margin:0 0 18px; padding:11px 14px; border-radius:8px; background:#fff4e5; color:#8a4b08; }
    .metrics { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
    .card,.panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; }
    .card { padding:16px 18px; min-height:98px; } .card .label { color:var(--muted); font-size:13px; }
    .card .value { margin-top:8px; font-size:25px; font-weight:720; } .delta.up { color:var(--red); } .delta.down { color:#18815f; }
    .hero { display:grid; grid-template-columns:330px 1fr; gap:14px; margin-bottom:14px; }
    .panel { padding:20px; }
    .gauge { --score:50; width:220px; height:220px; margin:8px auto 14px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--red) calc(var(--score)*1%),#edf0f4 0); position:relative; }
    .gauge:after { content:""; position:absolute; inset:20px; border-radius:50%; background:white; }
    .gauge-value { z-index:1; text-align:center; font-size:42px; font-weight:760; } .gauge-value small { display:block; font-size:14px; color:var(--muted); font-weight:500; }
    .analysis { border-left:4px solid var(--red); background:#fff; padding:14px 16px; white-space:pre-line; }
    .components { display:grid; gap:9px; }
    .component { display:grid; grid-template-columns:140px 1fr 54px 65px; align-items:center; gap:10px; }
    .component-hint { grid-column:1/-1; margin:-3px 0 3px 150px; color:#8a4b08; font-size:12px; }
    .track { height:9px; background:#edf0f4; border-radius:9px; overflow:hidden; } .fill { height:100%; background:var(--red); border-radius:9px; }
    .badge { font-size:11px; text-align:center; border-radius:20px; padding:2px 7px; background:#eef2ff; color:#3448a3; }
    .badge.missing { background:#f2f4f7; color:#667085; } .badge.proxy { background:#fff3e0; color:#9a5700; }
    .chart { width:100%; height:280px; }
    .grids { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:12px; font-weight:600; }
    .empty { color:var(--muted); padding:36px 0; text-align:center; }
    .data-notices { display:grid; gap:10px; }
    .data-notice { padding:13px 14px; border:1px solid #f1d6ad; border-radius:8px; background:#fffaf2; color:#5f3b12; }
    .data-notice-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; color:#7a4307; }
    .data-notice-head span { flex:none; font-size:11px; border-radius:14px; padding:2px 8px; background:#ffedcf; }
    .data-notice-line { margin-top:4px; }
    .data-notice details { margin-top:8px; color:var(--muted); }
    .data-notice summary { cursor:pointer; }
    .data-notice code { display:block; margin-top:5px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; }
    .foot { margin-top:18px; color:var(--muted); font-size:12px; }
    @media (max-width:900px) { .metrics { grid-template-columns:repeat(2,1fr); } .hero,.grids { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } .component-hint { margin-left:0; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>A股市场情绪指数</h1><div class="subtitle">九分项公开数据源适配版 · 数值由 Go 确定性计算</div></div><button id="refresh">获取最新市场数据</button></header>
  <div id="notice" class="notice"></div>
  <section class="metrics">
    <div class="card"><div class="label">市场情绪指数</div><div id="score" class="value">--</div></div>
    <div class="card"><div class="label">当前状态</div><div id="state" class="value">--</div></div>
    <div class="card"><div class="label">较上一交易日</div><div id="change" class="value">--</div></div>
    <div class="card"><div class="label">可用分项</div><div id="usable" class="value">-- / 9</div></div>
    <div class="card"><div class="label">最新交易日</div><div id="date" class="value" style="font-size:20px">--</div></div>
  </section>
  <section class="hero">
    <div class="panel"><div id="gauge" class="gauge"><div class="gauge-value"><span id="gaugeScore">--</span><small id="gaugeState">等待数据</small></div></div></div>
    <div class="panel"><h2>九分项</h2><div id="components" class="components"><div class="empty">等待数据</div></div></div>
  </section>
  <section class="panel"><h2>Agent 市场解读</h2><div id="analysis" class="analysis">首次使用请点击“获取最新市场数据”。</div></section>
  <section class="panel" style="margin-top:14px"><h2>历史走势</h2><canvas id="history" class="chart"></canvas></section>
  <section class="grids">
    <div class="panel"><h2>行业涨幅前十</h2><div id="industries"></div></div>
    <div class="panel"><h2>同花顺强势股前十</h2><div id="hot"></div></div>
  </section>
  <section class="grids">
    <div class="panel"><h2>主要指数</h2><div id="quotes"></div></div>
    <div class="panel"><h2>数据状态与处理建议</h2><div id="errors" class="muted">暂无数据</div></div>
  </section>
  <div class="foot">仅用于量化研究与市场观察，不构成投资建议。proxy 表示公开数据代理口径；missing 分项固定使用 50 分。</div>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>Number.isFinite(Number(n))?Number(n).toFixed(d):'--';
function table(headers,rows){if(!rows.length)return '<div class="empty">暂无数据</div>';return `<table><thead><tr>${headers.map(h=>`<th>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${esc(h[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function render(s){
  $('score').textContent=fmt(s.score); $('state').textContent=s.state||'--'; $('date').textContent=s.trade_date||'--';
  const change=Number(s.change||0); $('change').textContent=(change>0?'+':'')+fmt(change); $('change').className='value delta '+(change>0?'up':change<0?'down':'');
  const usable=(s.components||[]).filter(c=>c.status!=='missing').length; $('usable').textContent=`${usable} / 9`;
  $('gauge').style.setProperty('--score',Math.max(0,Math.min(100,s.score||0))); $('gaugeScore').textContent=fmt(s.score); $('gaugeState').textContent=s.state||'--';
  $('analysis').textContent=s.analysis||'暂无解读';
  const statusLabels={ok:'正常',proxy:'代理',missing:'缺失'};
  $('components').innerHTML=(s.components||[]).map(c=>{const hint=c.status==='missing'||/失败|缓存|缺少|不足|为空/.test(c.message||'');return `<div class="component" title="${esc(c.message||c.source)}"><span>${esc(c.name)}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,c.score))}%"></div></div><b>${fmt(c.score)}</b><span class="badge ${esc(c.status)}">${esc(statusLabels[c.status]||c.status)}</span>${hint?`<div class="component-hint">${esc(c.message||'数据不可用')}</div>`:''}</div>`}).join('')||'<div class="empty">暂无数据</div>';
  $('industries').innerHTML=table([['行业',r=>r.name],['涨跌幅',r=>fmt(r.change_pct,2)+'%'],['领涨股',r=>r.leader||'--']],(s.industries||[]).slice(0,10));
  $('hot').innerHTML=table([['代码',r=>r.code],['名称',r=>r.name],['涨幅',r=>fmt(r.change_pct,2)+'%'],['题材',r=>r.reason||'--']],(s.hot_stocks||[]).slice(0,10));
  $('quotes').innerHTML=table([['指数',r=>r.name],['现价',r=>fmt(r.price,2)],['涨跌幅',r=>fmt(r.change_pct,2)+'%']],s.quotes||[]);
  const notices=s.data_notices||[], errors=Object.entries(s.errors||{});
  if(notices.length){$('errors').className='data-notices';$('errors').innerHTML=notices.map(n=>`<article class="data-notice"><div class="data-notice-head"><b>${esc(n.title)}</b><span>数据降级</span></div><div class="data-notice-line"><strong>影响：</strong>${esc(n.impact)}</div><div class="data-notice-line"><strong>系统处理：</strong>${esc(n.fallback)}</div><div class="data-notice-line"><strong>建议：</strong>${esc(n.suggestion)}</div><details><summary>技术详情</summary><code>${esc(n.key)}：${esc(n.detail)}</code></details></article>`).join('')}
  else if(errors.length){$('errors').className='data-notices';$('errors').innerHTML=errors.map(([k,v])=>`<article class="data-notice"><div class="data-notice-head"><b>数据源请求失败</b><span>数据降级</span></div><div class="data-notice-line"><strong>影响：</strong>对应数据可能不完整，其余数据继续计算。</div><div class="data-notice-line"><strong>系统处理：</strong>依赖该数据的分项会显示代理或缺失状态。</div><div class="data-notice-line"><strong>建议：</strong>稍后再次刷新；连续失败时检查网络。</div><details><summary>技术详情</summary><code>${esc(k)}：${esc(v)}</code></details></article>`).join('')}
  else{$('errors').className='muted';$('errors').textContent='全部请求正常；分项的代理状态属于既定口径，不是请求错误。'}
}
function draw(history){
  const canvas=$('history'), dpr=window.devicePixelRatio||1, rect=canvas.getBoundingClientRect(); canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  const c=canvas.getContext('2d'); c.scale(dpr,dpr); const w=rect.width,h=rect.height,p=36; c.clearRect(0,0,w,h);
  c.strokeStyle='#e4e7ec'; c.fillStyle='#667085'; c.font='12px sans-serif';
  [0,20,40,60,80,100].forEach(v=>{const y=h-p-(h-2*p)*v/100;c.beginPath();c.moveTo(p,y);c.lineTo(w-p,y);c.stroke();c.fillText(v,4,y+4)});
  if(!history.length){c.fillText('历史会从首次刷新开始逐日积累',p,h/2);return}
  c.strokeStyle='#d94a4a';c.lineWidth=2.5;c.beginPath();history.forEach((r,i)=>{const x=p+(w-2*p)*(history.length===1?.5:i/(history.length-1)),y=h-p-(h-2*p)*r.score/100;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
  c.fillStyle='#667085';c.fillText(history[0].trade_date,p,h-10);if(history.length>1)c.fillText(history.at(-1).trade_date,w-p-76,h-10);
}
async function load(){const h=await fetch('/api/history').then(r=>r.json());draw(Array.isArray(h)?h:[]);if(h.length)render(h.at(-1));}
$('refresh').onclick=async()=>{const b=$('refresh'),n=$('notice');b.disabled=true;b.textContent='正在采集…';n.style.display='none';try{const r=await fetch('/api/refresh',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);render(j);await load()}catch(e){n.textContent=`刷新失败：${e.message}。请稍后重试；若持续失败，请检查网络和下方数据状态。`;n.style.display='block'}finally{b.disabled=false;b.textContent='获取最新市场数据'}};
addEventListener('resize',()=>fetch('/api/history').then(r=>r.json()).then(draw));load().catch(e=>{$('notice').textContent=e.message;$('notice').style.display='block'});
</script>
</body>
</html>
